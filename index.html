<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Feed</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0A0A0A;
            --surface-color: #141414;
            --border-color: #262626;
            --text-primary: #F5F5F5;
            --text-secondary: rgba(245, 245, 245, 0.6);
            --accent-blue: #0095F6;
            --accent-amber: #F5C518; /* Polite warning color */
            --accent-green: #00E5C7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            user-select: none;
        }

        /* --- APP LAYOUT SHELL --- */
        .app-shell {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        /* --- TOP NAV (Subscriptions) --- */
        .top-nav {
            height: 64px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 16px;
            background: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .app-logo {
            font-size: 20px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            margin-right: auto;
        }
        .subs-bar {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .subs-bar::-webkit-scrollbar { display: none; }
        .sub-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: 50px;
            flex-shrink: 0;
        }
        .sub-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(145deg, #333, #111);
            border: 2px solid var(--accent-blue);
            background-size: cover;
            background-position: center;
        }
        .sub-name {
            font-size: 10px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
        }

        /* --- MAIN FEED --- */
        .feed-container {
            flex: 1;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }
        .feed-container::-webkit-scrollbar { display: none; }

        .post-card {
            height: calc(100vh - 64px - 60px);
            height: calc(100dvh - 64px - 60px);
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            border-bottom: 1px solid var(--border-color);
            background: #000;
            overflow: hidden;
        }

        .post-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            background-position: center;
            filter: brightness(0.4) blur(2px);
            z-index: 0;
        }

        /* Post Header */
        .post-header {
            position: absolute;
            top: 0; left: 0; right: 0;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 5;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
        }
        .post-avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            background-size: cover;
            border: 1px solid #333;
        }
        .post-author {
            font-size: 13px;
            font-weight: 600;
        }
        .post-meta {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Right Action Bar */
        .action-bar {
            position: absolute;
            right: 8px;
            bottom: 90px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 15;
        }
        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .action-icon {
            width: 28px; height: 28px;
            stroke: #fff;
            fill: none;
            stroke-width: 1.8;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
            transition: transform 0.2s ease;
        }
        .action-item:active .action-icon { transform: scale(0.9); }
        .action-text {
            font-size: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        .action-icon.active { stroke: var(--accent-blue); fill: var(--accent-blue); }

        /* Article Reader */
        .article-container {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 65%;
            background: linear-gradient(to top, #000 85%, transparent 100%);
            padding: 20px 16px 40px 16px;
            z-index: 10;
            overflow-y: auto;
            overscroll-behavior: contain;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
        }
        .article-container.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .article-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; line-height: 1.3; }
        .article-body { font-size: 13px; line-height: 1.6; color: rgba(255,255,255,0.9); }
        .article-body p { margin-bottom: 12px; }
        .article-body mark { background: rgba(245, 197, 24, 0.2); color: var(--accent-amber); padding: 2px 4px; border-radius: 2px; }

        .status-badge {
            display: inline-block;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-weight: 700;
        }
        .badge-full { background: rgba(0, 229, 199, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .badge-mercy { background: rgba(245, 197, 24, 0.15); color: var(--accent-amber); border: 1px solid var(--accent-amber); }
        .badge-truncated { background: rgba(245, 197, 24, 0.15); color: var(--accent-amber); border: 1px solid var(--accent-amber); }
        
        .info-notice {
            margin-top: 16px;
            padding: 14px;
            background: rgba(245, 197, 24, 0.05);
            border: 1px solid rgba(245, 197, 24, 0.2);
            border-radius: 8px;
            font-size: 11px;
            color: var(--accent-amber);
            line-height: 1.5;
            font-family: 'JetBrains Mono', monospace;
        }

        /* The Cognitive Gate (Overlay) */
        .gate-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(8px);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 30px 20px 80px 20px;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        .gate-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .gate-header {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .gate-question { font-size: 18px; font-weight: 600; line-height: 1.4; margin-bottom: 24px; }

        .gate-options { display: flex; flex-direction: column; gap: 10px; }
        .gate-option {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 14px;
            border-radius: 8px;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            gap: 12px;
            align-items: center;
            transition: all 0.2s ease;
        }
        .gate-option:active { transform: scale(0.98); }
        .opt-letter { font-weight: 700; color: var(--text-secondary); }
        
        .gate-option.correct { background: rgba(0, 229, 199, 0.1); border-color: var(--accent-green); color: var(--accent-green); }
        .gate-option.wrong { background: rgba(245, 197, 24, 0.1); border-color: var(--accent-amber); color: var(--accent-amber); }

        /* Bottom Nav */
        .bottom-nav {
            height: 60px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--bg-color);
            position: sticky;
            bottom: 0;
            z-index: 50;
        }
        .nav-btn { color: var(--text-secondary); display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
        .nav-btn.active { color: #fff; }
        .nav-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; }
        .nav-btn span { font-size: 10px; font-weight: 500; }
    </style>
</head>
<body>

<div class="app-shell">
    
    <!-- Top Nav (Subscriptions) -->
    <div class="top-nav">
        <div class="app-logo">NEXUS</div>
        <div class="subs-bar" id="subsBar"></div>
    </div>

    <!-- Main Feed -->
    <div id="feed" class="feed-container"></div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <div class="nav-btn active">
            <svg viewBox="0 0 24 24"><path d="M3 12L12 3l9 9M5 10v10a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1V10"></path></svg>
            <span>Feed</span>
        </div>
        <div class="nav-btn">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <span>Explore</span>
        </div>
        <div class="nav-btn">
            <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
            <span>Library</span>
        </div>
        <div class="nav-btn">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Profile</span>
        </div>
    </div>

</div>

<script>
    const CREATORS = [
        { name: 'Tech_Daily', avatar: 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=100&q=80' },
        { name: 'Quantum_W', avatar: 'https://images.unsplash.com/photo-1635070041078-e363dbe005cb?auto=format&fit=crop&w=100&q=80' },
        { name: 'Neuro_Code', avatar: 'https://images.unsplash.com/photo-1555431189-0fabf2667795?auto=format&fit=crop&w=100&q=80' }
    ];

    const POSTS = [
        {
            id: 'post_1',
            author: 'Tech_Daily',
            avatar: CREATORS[0].avatar,
            bgImage: 'https://images.unsplash.com/photo-1620712943543-bcc4688e7485?auto=format&fit=crop&w=1000&q=80',
            question: "Current scaling laws suggest AI will achieve general human-level reasoning across all domains within what timeframe?",
            options: ["< 5 years", "10-20 years", "50+ years", "Never"],
            correctIndex: 1,
            title: "The Path to AGI: GPT-6 and Beyond",
            body: `<p>Projections suggest <mark>AGI could be realized within 10 to 20 years</mark> based on exponential compute growth.</p><p>Models like GPT-4 demonstrate a trajectory where systems construct internal world models, exhibiting zero-shot reasoning across logic puzzles.</p><p>The bottleneck is no longer just data; it is the alignment problem. Ensuring superintelligent systems act in accordance with human values is the primary metric gating the timeline.</p>`
        },
        {
            id: 'post_2',
            author: 'Quantum_W',
            avatar: CREATORS[1].avatar,
            bgImage: 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1000&q=80',
            question: "Which cryptographic standard breaks first when Fault-Tolerant Quantum Computers become viable?",
            options: ["AES-256", "RSA-2048", "SHA-3", "None"],
            correctIndex: 1,
            title: "Quantum Decryption: The Fall of RSA",
            body: `<p>The advent of fault-tolerant quantum computing marks the end of classical cryptography. <mark>RSA-2048 will be trivially broken by Shor's Algorithm</mark> once a quantum computer with sufficient logical qubits is deployed.</p><p>Unlike symmetric key algorithms which only suffer a quadratic speedup, RSA relies on integer factorization—a problem quantum computers solve exponentially faster.</p><p>The transition to Post-Quantum Cryptography is estimated to take 5 to 10 years globally.</p>`
        }
    ];

    const STORAGE_KEY = 'nexus_state';
    let state = {
        viewed: [],
        saved: [],
        wrongCount: 0
    };

    function loadState() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) state = JSON.parse(stored);
    }
    function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function renderSubs() {
        const bar = document.getElementById('subsBar');
        bar.innerHTML = CREATORS.map(c => `
            <div class="sub-item">
                <div class="sub-avatar" style="background-image: url('${c.avatar}')"></div>
                <div class="sub-name">${c.name}</div>
            </div>
        `).join('');
    }

    function renderFeed() {
        const feed = document.getElementById('feed');
        feed.innerHTML = '';

        POSTS.forEach(post => {
            const isSaved = state.saved.includes(post.id);
            const isViewed = state.viewed.includes(post.id);
            const postEl = document.createElement('div');
            postEl.className = 'post-card';
            
            postEl.innerHTML = `
                <div class="post-bg" style="background-image: url('${post.bgImage}')"></div>
                
                <div class="post-header">
                    <div class="post-avatar" style="background-image: url('${post.avatar}')"></div>
                    <div>
                        <div class="post-author">${post.author}</div>
                        <div class="post-meta">Sponsored Knowledge</div>
                    </div>
                </div>

                <div class="action-bar">
                    <div class="action-item" id="save-${post.id}">
                        <svg class="action-icon ${isSaved ? 'active' : ''}" viewBox="0 0 24 24" fill="${isSaved ? 'var(--accent-blue)' : 'none'}" stroke="currentColor" stroke-width="1.8"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                        <span class="action-text">Save</span>
                    </div>
                    <div class="action-item">
                        <svg class="action-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                        <span class="action-text">Source</span>
                    </div>
                </div>

                <div class="article-container" id="container-${post.id}">
                    <div class="status-badge" id="badge-${post.id}"></div>
                    <h1 class="article-title">${post.title}</h1>
                    <div class="article-body" id="body-${post.id}"></div>
                </div>

                <div class="gate-overlay ${isViewed ? 'hidden' : ''}" id="gate-${post.id}">
                    <div class="gate-header">[ COGNITIVE GATE ]</div>
                    <div class="gate-question">${post.question}</div>
                    <div class="gate-options">
                        ${post.options.map((opt, i) => `
                            <button class="gate-option" data-post-id="${post.id}" data-index="${i}" data-correct="${i === post.correctIndex}">
                                <span class="opt-letter">${String.fromCharCode(65 + i)}</span>
                                <span>${opt}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
            feed.appendChild(postEl);

            if (isViewed) {
                // Render without gate if already viewed
                renderArticle(post, true, true); 
            }
        });

        attachListeners();
    }

    function renderArticle(post, isCorrect, isMercy = false) {
        const container = document.getElementById(`container-${post.id}`);
        const badge = document.getElementById(`badge-${post.id}`);
        const body = document.getElementById(`body-${post.id}`);

        let bodyHTML = post.body;
        let badgeClass = 'badge-full';
        let badgeText = 'FULL CONTEXT UNLOCKED';

        if (!isCorrect) {
            if (state.wrongCount <= 10) {
                // MERCY PERIOD
                badgeClass = 'badge-mercy';
                badgeText = 'FULL CONTEXT GRANTED (LEARNING MODE)';
            } else {
                // TRUNCATION PENALTY
                badgeClass = 'badge-truncated';
                badgeText = 'FOCUSED SUMMARY UNLOCKED';
                
                // Truncate the body
                const paragraphs = post.body.split('</p>');
                if (paragraphs.length > 1) {
                    bodyHTML = paragraphs[0] + '</p>' + paragraphs[1] + '</p>'; // Keep only first 2 paragraphs
                }
                
                bodyHTML += `
                    <div class="info-notice">
                        We respect your cognitive journey. A slight divergence from the source, so we've curated a focused summary for you. Master the core concepts to unlock deeper context next time.
                    </div>
                `;
            }
        }

        badge.className = `status-badge ${badgeClass}`;
        badge.innerText = badgeText;
        body.innerHTML = bodyHTML;
        container.classList.add('active');
    }

    function attachListeners() {
        // Quiz Options
        document.querySelectorAll('.gate-option').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const postId = e.currentTarget.dataset.postId;
                const isCorrect = e.currentTarget.dataset.correct === 'true';
                const gateEl = document.getElementById(`gate-${postId}`);
                const postData = POSTS.find(p => p.id === postId);

                // Highlight
                gateEl.querySelectorAll('.gate-option').forEach(opt => {
                    if (opt.dataset.correct === 'true') opt.classList.add('correct');
                    else if (opt === e.currentTarget) opt.classList.add('wrong');
                    opt.style.pointerEvents = 'none';
                });

                // State update
                if (!state.viewed.includes(postId)) state.viewed.push(postId);
                if (!isCorrect) state.wrongCount++;
                saveState();

                // Reveal
                setTimeout(() => {
                    renderArticle(postData, isCorrect);
                    gateEl.classList.add('hidden');
                }, 1000);
            });
        });

        // Save Buttons
        document.querySelectorAll('[id^="save-"]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const postId = e.currentTarget.id.replace('save-', '');
                const svg = e.currentTarget.querySelector('.action-icon');
                const idx = state.saved.indexOf(postId);
                
                if (idx > -1) {
                    state.saved.splice(idx, 1);
                    svg.classList.remove('active');
                    svg.setAttribute('fill', 'none');
                } else {
                    state.saved.push(postId);
                    svg.classList.add('active');
                    svg.setAttribute('fill', 'var(--accent-blue)');
                }
                saveState();
            });
        });
    }

    // INIT
    loadState();
    renderSubs();
    renderFeed();
</script>
</body>
</html>
